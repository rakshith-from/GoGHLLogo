<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="nibGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAA33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGradD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7FC1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8C00" />
      <stop offset="100%" style="stop-color:#5B9BD5" />
    </linearGradient>
    <filter id="shadowD">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="480" height="160" rx="12" fill="#0D1B2A"/>

  <!-- Pen body -->
  <g transform="translate(20, 20)" filter="url(#shadowD)">
    <rect x="14" y="22" width="62" height="22" rx="11" ry="11" fill="url(#bodyGradD)"/>
    <rect x="62" y="18" width="5" height="32" rx="2.5" fill="#3A6EA0"/>
    <circle cx="64.5" cy="17" r="3.5" fill="#3A6EA0"/>
    <rect x="48" y="22" width="2" height="22" rx="1" fill="#FFFFFF" opacity="0.25"/>
    <rect x="14" y="22" width="20" height="22" rx="11" ry="11" fill="#2D4E7A"/>
    <polygon points="14,28 14,36 2,32" fill="url(#nibGradD)"/>
    <line x1="14" y1="32" x2="3" y2="32" stroke="#CC6600" stroke-width="0.8" opacity="0.7"/>
    <polygon points="14,28 14,32 5,32" fill="#FFCC66" opacity="0.35"/>
    <circle cx="2.5" cy="32" r="2" fill="#0D1B2A"/>
    <rect x="76" y="22" width="8" height="22" rx="4" fill="#2D4E7A"/>
    <rect x="76" y="28" width="8" height="3" fill="#FFAA33" rx="1"/>
    <rect x="76" y="33" width="8" height="3" fill="#FFAA33" rx="1"/>
  </g>

  <!-- Ink swirl -->
  <path d="M 22,78 Q 45,68 68,78 Q 91,88 114,78"
        stroke="url(#nibGradD)" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.8"/>
  <circle cx="22" cy="78" r="2.5" fill="#FF8C00" opacity="0.9"/>

  <!-- "my" in orange -->
  <text x="130" y="90"
        font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#FF8C00"
        letter-spacing="-1">my</text>

  <!-- "pen" in light blue/white -->
  <text x="240" y="90"
        font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#FFFFFF"
        letter-spacing="-1">pen</text>

  <!-- Underline bar -->
  <rect x="130" y="100" width="320" height="4" rx="2" fill="url(#barGradD)"/>

  <!-- Tagline -->
  <text x="131" y="125"
        font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
        font-size="14"
        font-weight="400"
        fill="#8AABCC"
        letter-spacing="3.5">WRITE YOUR STORY</text>

  <!-- Tricolor dots -->
  <circle cx="444" cy="112" r="3" fill="#FF8C00" opacity="0.8"/>
  <circle cx="444" cy="103" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="444" cy="121" r="3" fill="#1DBF73" opacity="0.8"/>
</svg>
