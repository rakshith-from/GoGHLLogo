<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#264D87" />
      <stop offset="100%" style="stop-color:#1E3A5F" />
    </linearGradient>
    <linearGradient id="nibI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAA33" />
      <stop offset="100%" style="stop-color:#FF6B00" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgCircle)"/>

  <!-- Outer ring accent -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#FF6B00" stroke-width="2.5" opacity="0.6"/>

  <!-- Pen (horizontal, centered) -->
  <g transform="translate(14, 39)">
    <!-- Pen barrel -->
    <rect x="14" y="0" width="52" height="20" rx="10" fill="#4A7FC1"/>

    <!-- Barrel accent line -->
    <rect x="40" y="0" width="2" height="20" rx="1" fill="#FFFFFF" opacity="0.2"/>

    <!-- Grip section -->
    <rect x="14" y="0" width="18" height="20" rx="10" fill="#2D5A96"/>

    <!-- Nib -->
    <polygon points="14,3 14,17 3,10" fill="url(#nibI)" filter="url(#glow)"/>
    <line x1="14" y1="10" x2="4" y2="10" stroke="#CC5500" stroke-width="0.8" opacity="0.5"/>

    <!-- End cap -->
    <rect x="66" y="0" width="8" height="20" rx="5" fill="#2D5A96"/>
    <rect x="66" y="5" width="8" height="3" fill="#FF8C00" rx="1"/>
    <rect x="66" y="11" width="8" height="3" fill="#FF8C00" rx="1"/>

    <!-- Clip -->
    <rect x="55" y="-4" width="4" height="28" rx="2" fill="#1E3A5F"/>
    <circle cx="57" cy="-4" r="3" fill="#1E3A5F"/>
  </g>

  <!-- Ink drop flourish -->
  <path d="M 16,68 Q 30,60 50,65 Q 70,70 84,62"
        stroke="#FF8C00" stroke-width="2" fill="none"
        stroke-linecap="round" opacity="0.6"/>

  <!-- Small "mp" monogram at bottom -->
  <text x="50" y="88"
        font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="10"
        font-weight="700"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.8">mp</text>
</svg>
