<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <!-- Gradient for pen nib -->
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for pen body -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#264D87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </linearGradient>
    <!-- Ink drop gradient -->
    <radialGradient id="inkGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </radialGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A5F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background (transparent) -->

  <!-- ======= ICON MARK ======= -->
  <!-- Pen body (barrel) -->
  <g transform="translate(20, 20)" filter="url(#shadow)">
    <!-- Pen barrel - elongated rounded rectangle -->
    <rect x="14" y="22" width="62" height="22" rx="11" ry="11" fill="url(#bodyGrad)"/>

    <!-- Pen clip -->
    <rect x="62" y="18" width="5" height="32" rx="2.5" fill="#1A3056"/>
    <circle cx="64.5" cy="17" r="3.5" fill="#1A3056"/>

    <!-- Barrel accent line -->
    <rect x="48" y="22" width="2" height="22" rx="1" fill="#4A90D9" opacity="0.5"/>

    <!-- Pen grip section (darker) -->
    <rect x="14" y="22" width="20" height="22" rx="11" ry="11" fill="#162E4A"/>

    <!-- Nib section - tapered toward tip -->
    <!-- Nib body -->
    <polygon points="14,28 14,36 2,32" fill="url(#nibGrad)"/>
    <!-- Nib center slit -->
    <line x1="14" y1="32" x2="3" y2="32" stroke="#CC5500" stroke-width="0.8" opacity="0.7"/>

    <!-- Nib highlight -->
    <polygon points="14,28 14,32 5,32" fill="#FFAA44" opacity="0.4"/>

    <!-- Ink dot at tip -->
    <circle cx="2.5" cy="32" r="2" fill="#1E3A5F"/>

    <!-- Pen end cap -->
    <rect x="76" y="22" width="8" height="22" rx="4" fill="#162E4A"/>
    <!-- End cap decorative ring -->
    <rect x="76" y="28" width="8" height="3" fill="#FF8C00" rx="1"/>
    <rect x="76" y="33" width="8" height="3" fill="#FF8C00" rx="1"/>
  </g>

  <!-- Ink swirl / flourish below pen -->
  <path d="M 22,78 Q 45,68 68,78 Q 91,88 114,78"
        stroke="url(#nibGrad)" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.7"/>

  <!-- Small ink dot -->
  <circle cx="22" cy="78" r="2.5" fill="#FF6B00" opacity="0.8"/>

  <!-- ======= WORDMARK ======= -->
  <!-- "my" in saffron orange -->
  <text x="130" y="90"
        font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#FF6B00"
        letter-spacing="-1">my</text>

  <!-- "pen" in navy blue -->
  <text x="240" y="90"
        font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#1E3A5F"
        letter-spacing="-1">pen</text>

  <!-- Underline accent bar - orange to blue gradient -->
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00" />
      <stop offset="45%" style="stop-color:#FF8C00" />
      <stop offset="100%" style="stop-color:#1E3A5F" />
    </linearGradient>
  </defs>
  <rect x="130" y="100" width="320" height="4" rx="2" fill="url(#barGrad)"/>

  <!-- Tagline -->
  <text x="131" y="125"
        font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
        font-size="14"
        font-weight="400"
        fill="#4A6FA5"
        letter-spacing="3.5">WRITE YOUR STORY</text>

  <!-- India dot — decorative bindi/dot above the 'i' in mypen (optional flourish) -->
  <!-- Small decorative element: three dots in Indian tricolor style -->
  <circle cx="444" cy="112" r="3" fill="#FF6B00" opacity="0.6"/>
  <circle cx="444" cy="103" r="3" fill="#1E3A5F" opacity="0.6"/>
  <circle cx="444" cy="121" r="3" fill="#138808" opacity="0.6"/>
</svg>
