<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Glass gradient for background -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>
    <!-- Subtle top shine -->
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Inner shadow filter -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="innerShadow"/>
      <feFlood flood-color="rgba(255,255,255,0.5)"/>
      <feComposite in2="innerShadow" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <!-- Soft drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <!-- Clip for shine overlay -->
    <clipPath id="roundedClip">
      <rect x="4" y="4" width="112" height="112" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Drop shadow layer -->
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="rgba(200,200,200,0.3)" filter="url(#dropShadow)"/>

  <!-- Glass background -->
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="url(#glassGrad)"/>

  <!-- Frosted border -->
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>

  <!-- Top shine highlight -->
  <rect x="4" y="4" width="112" height="56" rx="24" ry="24" fill="url(#shine)" clip-path="url(#roundedClip)" opacity="0.6"/>

  <!-- Speech bubble with glass effect -->
  <path d="M60 22
           C38 22 20 36.5 20 54.5
           C20 64 25.5 72.5 34 78
           C33 82 30 87 24.5 92
           C24.5 92 35 90.5 43 85
           C48 87.5 53.8 88.5 60 88.5
           C82 88.5 100 74 100 54.5
           C100 36.5 82 22 60 22Z"
        fill="none" stroke="rgba(0,0,0,0.7)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
