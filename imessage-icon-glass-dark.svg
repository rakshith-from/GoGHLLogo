<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark glass gradient -->
    <linearGradient id="darkGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(40,40,45,0.9)"/>
      <stop offset="50%" stop-color="rgba(20,20,25,0.85)"/>
      <stop offset="100%" stop-color="rgba(10,10,15,0.95)"/>
    </linearGradient>
    <!-- Top edge shine -->
    <linearGradient id="darkShine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <clipPath id="clip">
      <rect x="4" y="4" width="112" height="112" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Shadow -->
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="rgba(0,0,0,0.2)" filter="url(#glow)"/>

  <!-- Dark glass background -->
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="url(#darkGlass)"/>

  <!-- Glass border highlight -->
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top shine -->
  <rect x="4" y="4" width="112" height="56" rx="24" ry="24" fill="url(#darkShine)" clip-path="url(#clip)" opacity="0.5"/>

  <!-- White speech bubble -->
  <path d="M60 22
           C38 22 20 36.5 20 54.5
           C20 64 25.5 72.5 34 78
           C33 82 30 87 24.5 92
           C24.5 92 35 90.5 43 85
           C48 87.5 53.8 88.5 60 88.5
           C82 88.5 100 74 100 54.5
           C100 36.5 82 22 60 22Z"
        fill="rgba(255,255,255,0.95)"/>
</svg>
